[tools]
pkl = "latest"
rust = "latest"
hk = "latest"

[tasks.default]
description = "Run the CLI"
usage = '''
flag "-n --number <number>" help="Number of words to generate" default="2"
'''
run = "cargo run -- -n ${usage_number?}"

[tasks.english-txt]
description = "Download english dictionary"
run = "wget -nc https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt -O english.txt || exit 0"
sources = ["english.txt"]

[tasks.generate]
description = "Generate letters distribution"
run = "cargo run --bin generator -- english.txt src/choices.cbor"
outputs = ["src/choices.cbor"]
depends = ["english-txt"]

[tasks.test]
description = "Test the code"
run = "cargo test"

[tasks.lint]
description = "Lint the code"
run = "hk check"

[tasks.build]
description = "Build the CLI"
run = "cargo build"
sources = ["Cargo.toml", "src/**/*.rs"]
outputs = ["target/debug/flabild"]

[tasks.flabild]
description = "Run the built binary"
run = "target/debug/flabild"
depends = ["build"]
